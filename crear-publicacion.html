
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear publicación | ESI Activa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="pantalla-chats">

        <header class="encabezado">
            <h1>ESI ACTIVA</h1>
            <a href="registro.html" class="perfil">👤</a>
        </header>

        <section class="contenido-chats">
            <h2>Crear publicación</h2>
            <p>Compartí tus dudas, ideas o experiencias.</p>

            <form action="publicaciones.html">
                <label for="mensaje">Escribí tu publicación:</label>

                <textarea
                    id="mensaje"
                    name="mensaje"
                    rows="7"
                    placeholder="¿Qué querés compartir?"
                    required>
                </textarea>

                <button type="submit">Publicar</button>
            </form>

            <a href="publicaciones.html" class="volver">Cancelar</a>
        </section>

        <nav class="menu-inferior">
            <a href="inicio.html">
                <span>⌂</span>
                <small>Inicio</small>
            </a>

            <a href="#">
                <span>📍</span>
                <small>Ubicación</small>
            </a>

            <a href="publicaciones.html">
                <img src="https://cdn-icons-png.flaticon.com/512/3906/3906159.png" alt="Chats">
                <small>Chats</small>
            </a>
        </nav>

    </main>

</body>
</html>
