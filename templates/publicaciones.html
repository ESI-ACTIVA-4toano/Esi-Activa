
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chats | ESI Activa</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <main class="pantalla-chats">

        <header class="encabezado">
            <h1>ESI ACTIVA</h1>
            <a href="/registro" class="perfil">👤</a>
        </header>

        <section class="contenido-chats">
            <h2>Chats</h2>
            <p>Un espacio para compartir dudas y opiniones.</p>

            <div class="publicacion">
                <form action="/publicar" method="POST">
                    <label for="pregunta">Compartí tu duda o publicación:</label>
                    <textarea
                        id="pregunta"
                        name="pregunta"
                        rows="5"
                        placeholder="¿Qué querés compartir?"
                        required></textarea>
                    <button type="submit">Publicar</button>
                </form>
            </div>

            <h2>Publicaciones</h2>

            {% for consulta in consultas %}
                <div class="publicacion">
                    <p>{{ consulta[1] }}</p>
                    <small>{{ consulta[2] }}</small>
                </div>
            {% else %}
                <p>Todavía no hay publicaciones.</p>
            {% endfor %}

        </section>

        <nav class="menu-inferior">
            <a href="/inicio">
                <span>⌂</span>
                <small>Inicio</small>
            </a>

            <a href="/mapa">
                <span>📍</span>
                <small>Ubicación</small>
            </a>

            <a href="/">
                <span>💬</span>
                <small>Chats</small>
            </a>
        </nav>

    </main>

</body>
</html>
