
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Denuncia | ESI Activa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="pantalla-chats">

        <header class="encabezado">
            <h1>ESI ACTIVA</h1>
            <a href="registro.html" class="perfil">👤</a>
        </header>

        <section class="contenido-chats">

            <a href="inicio.html" class="volver">← Volver al inicio</a>

            <h2>Realizar una denuncia</h2>
            <p>Completá los siguientes datos para realizar tu reporte.</p>

            <div class="publicacion">
                <form>
                    <label for="aplicacion">¿En qué aplicación sucedió?</label>
                    <input type="text" id="aplicacion" placeholder="Nombre de la aplicación">

                    <label for="relato">Contanos qué sucedió</label>
                    <textarea id="relato" rows="4" placeholder="Escribí acá tu relato..."></textarea>

                    <label for="datos">Nombre y datos de la persona denunciante</label>
                    <input type="text" id="datos" placeholder="Nombre (opcional)">

                    <label for="evidencia">Adjuntar evidencia (opcional)</label>
                    <input type="file" id="evidencia">

                    <button type="button">Reportar</button>
                </form>
            </div>

        </section>

        <nav class="menu-inferior">
            <a href="inicio.html">
                <span>⌂</span>
                <small>Inicio</small>
            </a>

            <a href="mapa.html">
                <span>📍</span>
                <small>Ubicación</small>
            </a>

            <a href="publicaciones.html">
                <span>☰</span>
                <small>Chats</small>
            </a>
        </nav>

    </main>

</body>
</html>
