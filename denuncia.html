
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESI Activa | Denuncia</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: #fff5fa;
            font-family: Arial, sans-serif;
        }

        .contenedor-denuncia {
            max-width: 500px;
            margin: auto;
            padding: 20px;
        }

        .titulo {
            color: #d85c98;
            font-weight: bold;
        }

        .form-control, .form-select {
            border-radius: 15px;
            border: 1px solid #e8a8c7;
        }

        .btn-denuncia {
            background-color: #e88ab6;
            color: white;
            border-radius: 20px;
            border: none;
            padding: 10px 25px;
        }

        .btn-denuncia:hover {
            background-color: #d76b9f;
            color: white;
        }

        .barra-inferior {
            background-color: #dceeff;
            border-top: 1px solid #c5dfff;
        }

        .barra-inferior a {
            text-decoration: none;
            color: #557da6;
            font-weight: bold;
        }
    </style>
</head>

<body>

    <main class="contenedor-denuncia container">

        <h2 class="titulo text-center mt-3 mb-4">Realizar una denuncia</h2>

        <form>

            <div class="mb-3">
                <label for="aplicacion" class="form-label">¿En qué aplicación sucedió?</label>
                <input type="text" class="form-control" id="aplicacion" placeholder="Nombre de la aplicación">
            </div>

            <div class="mb-3">
                <label for="relato" class="form-label">Contanos qué sucedió</label>
                <textarea class="form-control" id="relato" rows="4" placeholder="Escribí acá tu relato..."></textarea>
            </div>

            <div class="mb-3">
                <label for="datos" class="form-label">Nombre y datos de la persona denunciante</label>
                <input type="text" class="form-control" id="datos" placeholder="Nombre (opcional)">
            </div>

            <div class="mb-4">
                <label for="evidencia" class="form-label">Adjuntar evidencia (opcional)</label>
                <input type="file" class="form-control" id="evidencia">
            </div>

            <div class="text-center">
                <button type="button" class="btn btn-denuncia">Reportar</button>
            </div>

        </form>

    </main>

   <footer class="barra-inferior fixed-bottom py-3">
    <div class="container d-flex justify-content-around">
        <a href="inicio.html">🏠 Home</a>
        <a href="mapa.html">📍 Ubicación</a>
        <a href="publicaciones.html">💬 Foro</a>
    </div>
</footer>

</body>
</html>
