
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrarse | ESI Activa</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="registro">
        <h1>ESI ACTIVA</h1>

        <h2>Registrarse</h2>
        <h3>Crear usuario</h3>

        <form action="inicio.html">
            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" placeholder="Ingresá tu usuario" required>

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" placeholder="Ingresá tu contraseña" required>

            <label for="gmail">Gmail</label>
            <input type="email" id="gmail" placeholder="Ingresá tu Gmail" required>

            <button type="submit">Crear cuenta</button>
        </form>
    </main>

</body>
</html>
