
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESI Activa | Iniciar sesión</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">

    <style>
        body {
            background-color: #fff5fa;
            font-family: Arial, sans-serif;
            min-height: 100vh;
        }

        .contenedor-login {
            max-width: 430px;
            margin: 70px auto;
            padding: 25px;
        }

        .titulo {
            color: #d85c98;
            font-weight: bold;
        }

        .form-control {
            border-radius: 15px;
            border: 1px solid #e8a8c7;
            padding: 12px;
        }

        .btn-login {
            background-color: #e88ab6;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px;
            font-weight: bold;
        }

        .btn-login:hover {
            background-color: #d76b9f;
            color: white;
        }

        .link-registro {
            color: #d85c98;
            text-decoration: none;
        }
    </style>
</head>

<body>

    <main class="container contenedor-login">

        <h2 class="titulo text-center mb-2">ESI Activa</h2>
        <p class="text-center text-secondary mb-4">Iniciá sesión en tu cuenta</p>

        <form>

            <div class="mb-3">
                <label for="usuario" class="form-label">Usuario o correo electrónico</label>
                <input type="text" class="form-control" id="usuario" placeholder="Ingresá tu usuario">
            </div>

            <div class="mb-4">
                <label for="contrasena" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="contrasena" placeholder="Ingresá tu contraseña">
            </div>

            <button type="button" class="btn btn-login w-100">Iniciar sesión</button>

        </form>

        <p class="text-center mt-4">
            ¿No tenés cuenta?
            <a href="registro.html" class="link-registro">Registrate</a>
