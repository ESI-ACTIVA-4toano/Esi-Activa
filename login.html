
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar sesión | ESI Activa</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <main class="registro">
        <h1>ESI ACTIVA</h1>
        <h2>Iniciar sesión</h2>
        <p>Ingresá a tu cuenta</p>

        <form>
            <label for="usuario">Usuario o correo electrónico</label>
            <input type="text" id="usuario" placeholder="Ingresá tu usuario">

            <label for="contrasena">Contraseña</label>
            <input type="password" id="contrasena" placeholder="Ingresá tu contraseña">

            <button type="button">Iniciar sesión</button>
        </form>

        <p>¿No tenés cuenta? <a href="registro.html">Registrate</a></p>
        <a href="inicio.html">Volver al inicio</a>
    </main>

</body>
</html>
